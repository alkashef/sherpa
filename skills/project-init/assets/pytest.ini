# pytest configuration. Run with: python -m pytest --cov=src --cov-branch --cov-fail-under=80
# .coveragerc makes the coverage count a process that a test starts, when it ends by itself.
# The normal run skips the live checks in tests/live/. Run them with: python scripts/live_checks.py
[pytest]
testpaths = tests
norecursedirs = .* *.egg build dist node_modules venv tests/live
asyncio_mode = auto
